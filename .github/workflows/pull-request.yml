# A devkit change builds against the newest green GUI.Forms build and against
# the floor's (devkit.toml minimum), so it cannot quietly raise the floor
# (DEVKIT_DESIGN.md section 2). Pushes to main build the newest only.
name: devkit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: devkit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Harness and packaging tests
        run: |
          python -B -m unittest discover -s harness/harness -p "test_*.py"
          python -B -m unittest discover -s programs/tools -p "test_*.py"
          python -B -m unittest discover -s pocket_reference/tools -p "test_*.py"
      - name: HOUSE_STYLE.md matches the notes repository
        run: python -B harness/harness/sync_house_style.py --check || echo "::warning file=HOUSE_STYLE.md::HOUSE_STYLE.md differs from notes main; run harness/harness/sync_house_style.py"
      - name: Views and programs checks (strict profile)
        run: python -B harness/harness/run_checks.py --profile strict views programs
  newest:
    uses: ./.github/workflows/build.yml
  floor:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      floor: true
