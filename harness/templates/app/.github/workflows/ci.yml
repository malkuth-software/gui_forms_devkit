name: CI
# {{title}} through template_harness's reusable workflows, at the commit
# harness.lock pins. Every `@<commit>` below must equal harness.lock: bump
# them together (template_harness docs/adopting.md §4). The project file is
# template_harness/projects/{{app}}.toml; its [ci] native_workflow and
# native_job name this file and the `native` job.
#
# Each job builds against the prebuilt GUI.Forms SDK devkit.toml pins
# (build.py: the devkit's devkit_build.py), compiling none of GUI.Forms.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the build script
        run: python3 -B -m unittest discover -s . -p "test_*.py"
  house-style:
    uses: {{harness_repository}}/.github/workflows/harness-house-style.yml@{{harness_commit}}
    with:
      product_path: {{app}}
      paths: src tests
      lifetime_paths: src tests
      retained_paths: src tests reference
  state-machines:
    uses: {{harness_repository}}/.github/workflows/harness-state-machines.yml@{{harness_commit}}
    with:
      product_path: {{app}}
      project: template_harness/projects/{{app}}.toml
      linux_profile: consumer
      configure_command: python3 {{app}}/build.py --configure-only
      build_dir: {{app}}/.build/native-linux-x64
      timeout_minutes: 90
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    uses: {{harness_repository}}/.github/workflows/harness-native.yml@{{harness_commit}}
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      shell: ${{ matrix.shell }}
      product_path: {{app}}
      project: template_harness/projects/{{app}}.toml
      linux_profile: consumer
      build_command: python {{app}}/build.py --jobs 4
      timeout_minutes: 90
